{% extends 'marketplace/base.html' %}
{% load i18n %}

{% block title %}{% trans "New listing" %} — Student Marketplace{% endblock %}

{% block content %}
<div class="panel panel-medium">
    <h1>{% trans "New listing" %}</h1>
    <form method="POST" novalidate>
        {% csrf_token %}
        {% include 'marketplace/_form_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">{% trans "Publish" %}</button>
        </div>
    </form>
</div>
{% endblock %}
